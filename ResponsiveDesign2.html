<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .hero{
            height: 30vh;
            background-color: #2c3e50;
            text-align: center;
            padding: 20px;
            Color: #fff;
        }
        .hero h1 {
            font-size: 24px;
            margin-bottom: 10px;    
        }
        .hero p{
            font-size: 14px;
        }
        @media (min-width: 768px) {
            .hero{
                height: 30vh;
                text-align: left;
                padding: 40px;
            }
            .hero h1 {
                font-size: 48px;
            }
            .hero p {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <header class="hero">
        <h1>welcome to my website</h1>
        <p>bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb</p>
    </header>
</body>
</html>
