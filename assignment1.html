<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>::before Assignment</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:#fff;
    padding:30px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:18px;
}

.required::before{
    content:"* ";
    color:red;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    font-size:16px;
    border:1px solid #999;
}

button{
    padding:10px 25px;
    font-size:18px;
    letter-spacing:3px;
    background:white;
    border:1px solid #555;
    cursor:pointer;
}

button:hover{
    background:#eee;
}
</style>
</head>

<body>

<div class="container">

    <div class="form-group">
        <label class="required" for="username">Username</label>
        <input type="text" id="username" required>
    </div>

    <div class="form-group">
        <label class="required" for="email">Email Address</label>
        <input type="email" id="email" required>
    </div>

    <div class="form-group">
        <label for="hobby">Hobby</label>
        <input type="text" id="hobby">
    </div>

    <button type="submit">SUBMIT</button>

</div>

</body>
</html>
