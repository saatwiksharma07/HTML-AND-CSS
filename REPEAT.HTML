<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repeat Function</title>
    <style>
        .container{
            display: grid;
            border: 2px double navy;
            margin: auto;
            width: 50vw;
            height: 50vh;
            gap: 20px;
            grid-template-columns: repeat(5,1fr);
            grid-template-rows: repeat(2,1fr);
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="background-color: red"></div>
        <div style="background-color: green"></div>
        <div style="background-color: blue"></div>
        <div style="background-color: lightblue"></div>
        <div style="background-color: lightpink"></div>
        <div style="background-color: lightseagreen"></div>
        <div style="background-color: darkblue"></div>
        <div style="background-color: darkmagenta"></div>
        <div style="background-color: darkorange"></div>
        <div style="background-color: black"></div>
    </div>
</body>
</html>
