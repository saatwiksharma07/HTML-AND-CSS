<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            display: grid;
            width: 100vw;
            height: 100vh;
            /* padding: 20px; */
            margin: auto;
            text-align: center;
            grid-template-columns: 498px 498px 498px;
            grid-template-rows: 229px 229px 229px;
            grid-column-gap: 20px;
            grid-row-gap:20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1" style="background-color: red;">Item1</div>
        <div class="item2" style="background-color: green;">Item2</div>
        <div class="item3" style="background-color: yellow;">Item3</div>
        <div class="item4" style="background-color: blue;">Item4</div>
        <div class="item5" style="background-color: violet;">Item5</div>
        <div class="item6" style="background-color: pink;">Item6</div>
        <div class="item7" style="background-color: cyan;">Item7</div>
        <div class="item8" style="background-color: brown;">Item8</div>
        <div class="item9" style="background-color: navy;">Item9</div>
    </div>
</body>
</html>
