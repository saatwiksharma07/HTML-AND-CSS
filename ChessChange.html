<html>

<head>

    <style>

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .board-container {
            width: 600px;
        }

        .chessboard {
            width: 600px;
            height: 600px;

            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);

            border: 5px solid black;
            box-shadow: 10px 10px 10px grey;

            box-sizing: border-box;
        }

        .white {
            background-color: white;
        }

        .black {
            background-color: black;
        }

        .checkbox-area {
            margin-top: 15px;
            font-size: 20px;
        }


        .board-container:has(#changeColor:checked) .white {
            background-color: yellow;
        }

        .board-container:has(#changeColor:checked) .black {
            background-color: maroon;
        }

    </style>

</head>


<body>

    <div class="board-container">

        <div class="chessboard">

            <div class="black"></div>
            <div class="white"></div>

            <div class="black"></div>

            <div class="black"></div>

            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>

            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>

        </div>



        <div class="checkbox-area">

    </div>

</body>

</html>
